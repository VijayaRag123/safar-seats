name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      # Pull requests: Chromium only (fast feedback). Pushes to main: Chromium, Firefox and WebKit.
      PW_PROJECT: ${{ github.event_name == 'pull_request' && '--project=chromium' || '' }}
      PW_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps $PW_BROWSERS
    # The tests start their own local server (see playwright.config.js), so they check
    # the code in this commit and do not depend on the GitHub Pages deploy.
    - name: Run Playwright tests
      run: npx playwright test $PW_PROJECT
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
